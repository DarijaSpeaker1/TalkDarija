kind = "web"
previewPath = "/"
title = "TalkDarija"
description = "A playful Moroccan Darija learning platform for beginners and returning learners, with personalized placement, interactive lessons, progress tracking, vocabulary review, and motivating daily practice."
version = "1.0.0"
id = "artifacts/talkdarija"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21815

[services.development]
run = "pnpm --filter @workspace/talkdarija run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talkdarija", "run", "build" ]
serve = "static"
publicDir = "artifacts/talkdarija/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21815"
BASE_PATH = "/"
